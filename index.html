<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vem pra minha casa hj?</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, #ff6fa5, #ff9ac1, #ffd1e0);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .card {
    background: rgba(255,255,255,0.9);
    border-radius: 24px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    max-width: 90%;
    width: 420px;
    z-index: 10;
  }
  h1 {
    color: #d6336c;
    font-size: 1.8rem;
    margin-bottom: 30px;
    line-height: 1.3;
  }
  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    position: relative;
    height: 70px;
  }
  button {
    font-size: 1.2rem;
    padding: 16px 32px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.15s ease;
  }
  button:active {
    transform: scale(0.95);
  }
  #simBtn {
    background: #ff4d8d;
    color: white;
    box-shadow: 0 6px 15px rgba(255,77,141,0.5);
  }
  #simBtn:hover {
    background: #e6396f;
    transform: scale(1.05);
  }
  #naoBtn {
    background: #ccc;
    color: #444;
    position: absolute;
  }
  .resposta {
    margin-top: 20px;
    font-size: 1.3rem;
    color: #d6336c;
    font-weight: bold;
    min-height: 30px;
  }
  .heart {
    position: fixed;
    bottom: -50px;
    font-size: 2rem;
    animation: floatUp linear forwards;
    z-index: 5;
    pointer-events: none;
  }
  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(-110vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div class="card">
  <h1>Vem pra minha casa hj? 🥺❤️</h1>
  <div class="buttons" id="buttonsWrap">
    <button id="simBtn" onclick="simClicado()">Sim! 💖</button>
    <button id="naoBtn" onclick="fugirBotao()">Não</button>
  </div>
  <div class="resposta" id="resposta"></div>
</div>

<script>
  const naoBtn = document.getElementById('naoBtn');
  const buttonsWrap = document.getElementById('buttonsWrap');
  const resposta = document.getElementById('resposta');

  function posicionarNaoInicial() {
    const wrapRect = buttonsWrap.getBoundingClientRect();
    const simBtn = document.getElementById('simBtn');
    const simRect = simBtn.getBoundingClientRect();
    naoBtn.style.left = (simRect.width + 20) + 'px';
    naoBtn.style.top = '0px';
  }

  window.addEventListener('load', posicionarNaoInicial);

  function fugirBotao() {
    const maxX = window.innerWidth - naoBtn.offsetWidth - 20;
    const maxY = window.innerHeight - naoBtn.offsetHeight - 20;
    const newX = Math.max(10, Math.random() * maxX);
    const newY = Math.max(10, Math.random() * maxY);

    naoBtn.style.position = 'fixed';
    naoBtn.style.left = newX + 'px';
    naoBtn.style.top = newY + 'px';

    resposta.textContent = 'Ele foge, tenta de novo! 😏';
  }

  naoBtn.addEventListener('mouseover', fugirBotao);
  naoBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    fugirBotao();
  }, { passive: false });

  function simClicado() {
    resposta.textContent = 'Eba! Te espero com todo amor! 💕🏠';
    soltarCoracoes();
  }

  function soltarCoracoes() {
    const emojis = ['❤️','💕','💖','💗','💓','💘','😍'];
    let count = 0;
    const interval = setInterval(() => {
      for (let i = 0; i < 5; i++) {
        criarCoracao(emojis[Math.floor(Math.random() * emojis.length)]);
      }
      count++;
      if (count > 20) clearInterval(interval);
    }, 150);
  }

  function criarCoracao(emoji) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = emoji;
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
    const duration = 3 + Math.random() * 2;
    heart.style.animationDuration = duration + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), duration * 1000);
  }
</script>

</body>
</html>
