<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vem pra minha casa hj?</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: linear-gradient(135deg, #ff6fa5, #ff9ac1, #ffd1e0);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    touch-action: manipulation;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 16px;
  }
  .card {
    background: rgba(255,255,255,0.9);
    border-radius: 24px;
    padding: clamp(24px, 6vw, 40px) clamp(18px, 5vw, 30px);
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    width: 420px;
    max-width: 100%;
    z-index: 10;
  }
  h1 {
    color: #d6336c;
    font-size: clamp(1.3rem, 5.5vw, 1.8rem);
    margin: 0 0 clamp(20px, 5vw, 30px);
    line-height: 1.3;
  }
  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    position: relative;
    min-height: 60px;
  }
  button {
    font-size: clamp(1rem, 4vw, 1.2rem);
    padding: 14px 28px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.15s ease;
    white-space: nowrap;
  }
  button:active {
    transform: scale(0.95);
  }
  #simBtn {
    background: #ff4d8d;
    color: white;
    box-shadow: 0 6px 15px rgba(255,77,141,0.5);
  }
  #simBtn:hover {
    background: #e6396f;
    transform: scale(1.05);
  }
  #naoBtn {
    background: #ccc;
    color: #444;
  }
  .resposta {
    margin-top: 20px;
    font-size: 1.3rem;
    color: #d6336c;
    font-weight: bold;
    min-height: 30px;
  }
  .heart {
    position: fixed;
    bottom: -50px;
    font-size: 2rem;
    animation: floatUp linear forwards;
    z-index: 5;
    pointer-events: none;
  }
  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(-110vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div class="card">
  <h1>Vem pra minha casa hj? 🥺❤️</h1>
  <div class="buttons" id="buttonsWrap">
    <button id="simBtn" onclick="simClicado()">Sim! 💖</button>
    <button id="naoBtn" onclick="fugirBotao()">Não</button>
  </div>
  <div class="resposta" id="resposta"></div>
</div>

<script>
  const naoBtn = document.getElementById('naoBtn');
  const buttonsWrap = document.getElementById('buttonsWrap');
  const resposta = document.getElementById('resposta');

  let naoFugiu = false;

  function viewportSize() {
    const vv = window.visualViewport;
    return {
      w: vv ? vv.width : window.innerWidth,
      h: vv ? vv.height : window.innerHeight
    };
  }

  function fugirBotao(e) {
    if (e) e.preventDefault();
    const { w, h } = viewportSize();
    const btnW = naoBtn.offsetWidth;
    const btnH = naoBtn.offsetHeight;
    const margin = 12;
    const maxX = Math.max(margin, w - btnW - margin);
    const maxY = Math.max(margin, h - btnH - margin);
    const newX = margin + Math.random() * (maxX - margin);
    const newY = margin + Math.random() * (maxY - margin);

    if (!naoFugiu) {
      naoBtn.style.position = 'fixed';
      naoFugiu = true;
    }
    naoBtn.style.left = newX + 'px';
    naoBtn.style.top = newY + 'px';
    naoBtn.style.margin = '0';

    resposta.textContent = 'Ele foge, tenta de novo! 😏';
  }

  naoBtn.addEventListener('mouseover', fugirBotao);
  naoBtn.addEventListener('touchstart', fugirBotao, { passive: false });
  naoBtn.addEventListener('click', fugirBotao);

  function simClicado() {
    resposta.textContent = 'Eba! Te espero com todo amor! 💕🏠';
    soltarCoracoes();
  }

  function soltarCoracoes() {
    const emojis = ['❤️','💕','💖','💗','💓','💘','😍'];
    let count = 0;
    const interval = setInterval(() => {
      for (let i = 0; i < 5; i++) {
        criarCoracao(emojis[Math.floor(Math.random() * emojis.length)]);
      }
      count++;
      if (count > 20) clearInterval(interval);
    }, 150);
  }

  function criarCoracao(emoji) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = emoji;
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
    const duration = 3 + Math.random() * 2;
    heart.style.animationDuration = duration + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), duration * 1000);
  }
</script>

</body>
</html>
